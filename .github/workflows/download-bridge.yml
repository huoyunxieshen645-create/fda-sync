name: Download Bridge
on:
  push:
    branches: [ main ]
    paths:
      - 'downloads/.request.txt'
      - '.github/workflows/download-bridge.yml'
      - '.github/scripts/download_bridge.py'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 reportlab img2pdf
          # scribd-downloader 1.3.1 is a py2-only wheel; pip refuses it on py3, so unzip manually
          curl -sL --max-time 60 -o /tmp/sd.whl "https://files.pythonhosted.org/packages/80/b0/8d3a3f584cc9da5e091bf1bbdb0a53b8b9ccca8edfc953276fa380537a08/scribd_downloader-1.3.1-py2-none-any.whl"
          unzip -o -q /tmp/sd.whl -d "$(python3 -c 'import site; print(site.getsitepackages()[0])')"

      - name: Download
        run: |
          python3 .github/scripts/download_bridge.py

      - name: Commit result
        run: |
          git config user.name "dl-bot"
          git config user.email "dl-bot@users.noreply.github.com"
          git add downloads/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: download bridge result [skip ci]"

      - name: Push changes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:main
